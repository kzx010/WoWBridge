[Test]
; 1 = run the in-game self-test suite on startup (written by tools/run_skyrim.py)
autorun=0

[WoW]
; Existing WoW 1.12.1 client folder containing WoW.exe and Data. Setup fills this in.
client=
; Legacy fallback when client is empty: directory containing client\Data from WoW 1.12.1. Relative paths start at the Skyrim game directory.
; Set an absolute Windows/Wine path here to use an existing client outside Skyrim.
root=WoW
; 1 = draw the WoW 1.12 interface (its FrameXML, read from client\Data)
interface=1
; 1 = WoW cursor control in play: the mouse moves the WoW cursor, right button held steers the camera
cursor=1
